# تطبيق أندرويد لرادار المناقصات – يُبنى هنا وينزل كملف APK في Releases:
#   https://github.com/<owner>/<repo>/releases/latest/download/TenderRadar.apk
# التطبيق يعرض نفس صفحات الرادار، ويفحص كل ساعة ويرسل إشعاراً بكل فرصة جديدة (بدون ntfy).
# كل نسخة تُجرَّب أولاً على محاكي أندرويد 10 و12 و14، ولا تُنشر إلا لو التطبيق اشتغل من غير ما يقفل.
# مفتاح التوقيع يُنشأ مرة واحدة ويُحفظ في Release من نوع Draft (خاص بأصحاب المستودع فقط) حتى تُثبَّت التحديثات فوق
# النسخة القديمة. لا تنشر هذا الـ Release.
name: Android app

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

concurrency:
  group: android-app
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: App icons from the web app
        run: |
          mkdir -p android/app/src/main/res/drawable-nodpi
          cp app/icons/maskable-512.png android/app/src/main/res/drawable-nodpi/ic_launcher_fg.png

      - name: Signing key (private draft release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/signing"; mkdir -p "$dir"
          rel=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '[.[] | select(.tag_name == "app-signing-key")][0].id // empty')
          if [ -n "$rel" ]; then
            for name in tender-radar.jks tender-radar.pass; do
              aid=$(gh api "repos/$GITHUB_REPOSITORY/releases/$rel/assets" --jq ".[] | select(.name == \"$name\") | .id")
              gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$aid" > "$dir/$name"
            done
            echo "Using the saved signing key"
          else
            pass=$(openssl rand -hex 16)
            keytool -genkeypair -keystore "$dir/tender-radar.jks" -storepass "$pass" -keypass "$pass" \
              -alias tender-radar -keyalg RSA -keysize 2048 -validity 10950 \
              -dname "CN=Tender Radar, O=CEC Egypt - Delta Office, C=EG"
            printf '%s' "$pass" > "$dir/tender-radar.pass"
            gh release create app-signing-key --draft --title "Android signing key - private, never publish" \
              --notes "Used by the Android build so that every update installs over the previous version. Keep it a draft." \
              "$dir/tender-radar.jks" "$dir/tender-radar.pass"
            echo "Created a new signing key"
          fi
          pass=$(cat "$dir/tender-radar.pass")
          echo "::add-mask::$pass"
          echo "SIGNING_STORE=$dir/tender-radar.jks" >> "$GITHUB_ENV"
          echo "SIGNING_PASS=$pass" >> "$GITHUB_ENV"

      - name: Build the APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Keep the APK for the phone test
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

  # Opens the app on Android emulators (as after installing, with and without notifications allowed, and the
  # hourly check). A version that closes is not published; the reason is in the job summary.
  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 29
            name: Android 10
          - api: 31
            name: Android 12
          - api: 34
            name: Android 14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk

      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Open the app on ${{ matrix.name }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash android/test-on-phone.sh app-release.apk "${{ matrix.name }} (API ${{ matrix.api }})"

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk

      - name: Publish the APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cp app-release.apk TenderRadar.apk
          tag="android-v1.0.${{ github.run_number }}"
          gh release create "$tag" TenderRadar.apk --latest \
            --title "تطبيق أندرويد – الإصدار 1.0.${{ github.run_number }}" \
            --notes "حمّل TenderRadar.apk على الموبايل وافتحه للتثبيت (اسمح بالتثبيت من المتصفح عند السؤال). التحديثات تُثبّت فوق النسخة القديمة."
          echo "### APK: https://github.com/$GITHUB_REPOSITORY/releases/latest/download/TenderRadar.apk" >> "$GITHUB_STEP_SUMMARY"
